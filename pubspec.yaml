name: opengps_nmea
description: "OpenGPS-NMEA — Turn your device into a wireless GPS for interfacing with navigation software."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Location services
  geolocator: ^13.0.2







  # Persistent storage
  shared_preferences: ^2.3.4

  # Network info (WiFi IP, Cellular IP)
  network_info_plus: ^6.1.2

  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0




  # WebSocket support
  web_socket_channel: ^3.0.2

  # Share / copy NMEA output
  share_plus: ^10.0.3




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

  # Integration testing
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
