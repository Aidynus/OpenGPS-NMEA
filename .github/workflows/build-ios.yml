# Сборка НЕподписанного IPA для iOS из форка OpenGPS-NMEA (Flutter). Положить в форк как .github/workflows/build-ios.yml
name: Build iOS (unsigned)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr OpenGPS-NMEA.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGPS-NMEA-unsigned-ipa
          path: OpenGPS-NMEA.ipa
