# Build of an UNSIGNED iOS IPA (JetourGPS) from this Flutter project.
name: Build iOS (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr JetourGPS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: JetourGPS-unsigned-ipa
          path: JetourGPS.ipa
